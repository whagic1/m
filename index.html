<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>404 Not Found</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#999;
    font:15px -apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  /* Looks like a plain not-found page. The whole screen is the paste catcher. */
  #c{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;-webkit-user-select:text;user-select:text;outline:none;caret-color:transparent}
  #c p{max-width:40ch;color:#888}
  #c p small{color:#555}
  #ok{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:18px;height:18px;border-radius:50%;background:#16c60c;box-shadow:0 0 12px #16c60c;opacity:0;transition:opacity .2s;pointer-events:none}
</style>
</head>
<body>
<div id="c" contenteditable="true" spellcheck="false" autocapitalize="off" autocorrect="off" inputmode="none">
  <p>404 — Not Found<br><small>The requested URL was not found on this server.</small></p>
</div>
<div id="ok"></div>
<script>
  var relay = "https://ntfy.sh";
  var topic = (location.hash.match(/t=([a-z0-9-]+)/i) || [])[1] || "mim-4a4db9d2d7cc";
  var box = document.getElementById("c");
  var ok = document.getElementById("ok");
  var busy = false;

  // Keep the catcher focused so a long-press offers Paste.
  function focusBox(){ try{ box.focus(); }catch(e){} }
  focusBox();
  box.addEventListener("click", focusBox);
  box.addEventListener("touchend", focusBox);

  function flash(color){ ok.style.background = color; ok.style.boxShadow = "0 0 14px " + color; ok.style.opacity = "1"; setTimeout(function(){ ok.style.opacity = "0"; }, 900); }
  var GREEN = "#16c60c", RED = "#e5484d";
  // On success, replace this history entry with Google: the 404 page leaves no back trace.
  var EXIT = "https://www.google.com/";
  function done(success){ flash(success ? GREEN : RED); if(success){ setTimeout(function(){ location.replace(EXIT); }, 650); } }
  function clearBox(){ box.innerHTML = '<p>404 — Not Found<br><small>The requested URL was not found on this server.</small></p>'; focusBox(); }

  function sendText(t){
    if(!t) return;
    if(!topic){ flash(RED); return; }
    fetch(relay + "/" + topic, { method:"POST", body:t })
      .then(function(r){ done(r && r.ok); }).catch(function(){ flash(RED); });
  }

  function sendImage(file){
    if(!file) return;
    if(!topic){ flash(RED); return; }
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var max = 1100, s = Math.min(1, max/Math.max(img.width,img.height));
      var cv = document.createElement("canvas");
      cv.width = Math.round(img.width*s); cv.height = Math.round(img.height*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(function(blob){
        fetch(relay + "/" + topic, { method:"PUT", headers:{ "Filename":"paste.jpg" }, body:blob })
          .then(function(r){ done(r && r.ok); }).catch(function(){ flash(RED); });
      }, "image/jpeg", 0.75);
    };
    img.src = url;
  }

  // The native Paste gesture (long-press Paste) or a hardware Cmd+V hands us text or an image.
  function onPaste(e){
    if(busy) return; busy = true; setTimeout(function(){ busy = false; }, 600);
    var dt = e.clipboardData || window.clipboardData;
    if(dt){
      var items = dt.items || [];
      for(var i=0;i<items.length;i++){
        if(items[i].kind === "file" && items[i].type.indexOf("image") === 0){
          e.preventDefault(); sendImage(items[i].getAsFile()); setTimeout(clearBox, 50); return;
        }
      }
      var text = dt.getData("text");
      if(text){ e.preventDefault(); sendText(text.trim()); setTimeout(clearBox, 50); return; }
    }
    // Fallback: let it paste into the box, then read it out.
    setTimeout(function(){ var t = box.innerText.replace(/404.*server\./s,"").trim(); if(t){ sendText(t); } clearBox(); }, 60);
  }
  box.addEventListener("paste", onPaste);
  document.addEventListener("paste", onPaste);   // catches Cmd+V even if the box lost focus
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) focusBox(); });
</script>
</body>
</html>
